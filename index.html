<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maintenance ALM — Abris Bac</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bl:#1B3A5C;--bll:#E8EFF7;--blm:#2E6DA4;
  --or:#E07B2A;--orl:#FDF0E4;
  --gr:#2A7A4B;--grl:#E4F5EC;
  --rd:#C0392B;--rdl:#FCEAE8;
  --bg:#F2F4F7;--card:#fff;
  --text:#1a1a1a;--muted:#6B7280;
  --border:#D1D5DB;--border2:#9CA3AF;
  --radius:14px;--radius-sm:9px;
}
html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* ── HEADER ── */
.hdr{background:var(--bl);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hdr-back{width:36px;height:36px;border-radius:9px;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-back:active{background:rgba(255,255,255,.3)}
.hdr-title{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.hdr-sub{font-size:11px;opacity:.7;margin-top:1px}
.hdr-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.hdr-btn:active{background:rgba(255,255,255,.3)}
.hdr-btn.or{background:var(--or)}

/* ── PAGE ── */
.pg{padding:14px 14px 48px}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--card);color:var(--text);outline:none}
.search-wrap input:focus{border-color:var(--blm)}
.search-wrap::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 6px;text-align:center}
.stat-n{font-size:22px;font-weight:700;color:var(--bl)}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}

/* ── ZONE GROUP ── */
.zone-hdr{font-size:11px;font-weight:700;color:var(--blm);text-transform:uppercase;letter-spacing:.06em;padding:12px 4px 6px;display:flex;align-items:center;gap:6px}
.zone-hdr::after{content:'';flex:1;height:1px;background:var(--blm);opacity:.25}

/* ── PAV CARD ── */
.pav{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pav:active{background:var(--bll)}
.pav-badge{min-width:48px;height:48px;border-radius:10px;background:var(--bll);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.pav-badge span:first-child{font-size:11px;font-weight:700;color:var(--blm)}
.pav-badge span:last-child{font-size:13px;font-weight:800;color:var(--bl)}
.pav-info{flex:1;min-width:0}
.pav-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pav-addr{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pav-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.pav-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.dot-ok{width:10px;height:10px;border-radius:50%;background:var(--gr)}
.dot-nok{width:10px;height:10px;border-radius:50%;background:var(--or)}
.dot-none{width:10px;height:10px;border-radius:50%;background:#D1D5DB}
.gps-link{font-size:18px;text-decoration:none}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-ok{background:var(--grl);color:var(--gr)}
.b-or{background:var(--orl);color:var(--or)}
.b-bl{background:var(--bll);color:var(--blm)}
.b-rd{background:var(--rdl);color:var(--rd)}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* ── FIELDS ── */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:var(--card);-webkit-appearance:none;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blm)}
.field textarea{min-height:72px;resize:vertical}

/* ── TÂCHES ── */
.task-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border:none}
.task-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--blm);flex-shrink:0;cursor:pointer}
.task-row label{font-size:14px;flex:1;cursor:pointer;line-height:1.3}
.task-row .task-sta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.sta-ok{background:var(--grl);color:var(--gr)}
.sta-ko{background:var(--rdl);color:var(--rd)}
.sta-na{background:var(--bll);color:var(--blm)}

/* ── PHOTOS ── */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-wrap{position:relative}
.ph-img{aspect-ratio:1;width:100%;border-radius:8px;object-fit:cover;border:1px solid var(--border);display:block;cursor:zoom-in}
.ph-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--rd);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ph-add{aspect-ratio:1;border:2px dashed var(--border2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--bll);color:var(--blm);font-size:12px;font-weight:600}
.ph-add:active{background:#d0e3f5}
.ph-add-icon{font-size:26px}

/* ── CANVAS SIGNATURE ── */
.sig-wrap{border:1.5px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden;background:#fff;touch-action:none}
canvas#sig-canvas{display:block;width:100%;height:140px;cursor:crosshair}
.sig-actions{display:flex;gap:8px;margin-top:8px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text);background:var(--card)}
.btn:active{opacity:.75}
.btn-p{background:var(--bl);color:#fff;border-color:var(--bl)}
.btn-p:active{background:#112840}
.btn-or{background:var(--or);color:#fff;border-color:var(--or)}
.btn-f{width:100%}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-d{background:var(--rdl);color:var(--rd);border-color:var(--rd)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ── DETAIL ROWS ── */
.dr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border:none}
.dl{font-size:13px;color:var(--muted)}
.dv{font-size:13px;font-weight:600;text-align:right;max-width:60%}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:14px}
.empty-text{font-size:15px;line-height:1.5}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:24px;font-size:14px;font-weight:600;z-index:9999;pointer-events:none;transition:opacity .4s;white-space:nowrap}

/* ── LIGHTBOX ── */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:95vw;max-height:90vh;border-radius:10px;object-fit:contain}
#lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer}

/* ── RAPPORT LIST ── */
.rpt-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rpt-row:active{background:var(--bll)}
.rpt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rpt-pav{font-size:14px;font-weight:700}
.rpt-date{font-size:11px;color:var(--muted)}
.rpt-addr{font-size:12px;color:var(--muted)}

/* ── ALERT ── */
.alert-card{border:1.5px solid var(--rd);background:var(--rdl);border-radius:var(--radius);padding:14px;margin-top:10px}
.alert-title{font-weight:700;color:var(--rd);margin-bottom:8px;font-size:14px}

mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
</style>

async function loadRapports(){
  try{
    const r=await fetch(FB_URL+'/rapports.json');

  }catch{S.rapports=[];}

function doLoginAdmin(){
  const code=(document.getElementById('login-code')?.value||'').trim();
  if(code!==ADMIN_PWD){toast('Code incorrect','#C0392B');return;}
  S.operateur='Administrateur';
  S.isAdmin=true;
  go('home');
}

function doLogin(){
  const uid=document.getElementById('login-user')?.value||'';
  const pwd=(document.getElementById('login-pwd')?.value||'').trim();
  if(!uid){toast('Sélectionnez votre nom','#C0392B');return;}
  const u=S.users.find(u=>u.id===uid);
  if(!u)return;
  if(u.pwd&&pwd!==u.pwd){toast('Mot de passe incorrect','#C0392B');return;}
  if(u.pwd&&!pwd){toast('Saisissez votre mot de passe','#C0392B');return;}
  S.operateur=u.nom;
  S.isAdmin=u.admin||false;
  go('home');
}

/* ══════════════════════════════════════════════
   VUE : HOME — Liste PAV
══════════════════════════════════════════════ */
function vHome(){
  const q=S.search.toLowerCase();
  const tj=tourneeJour(S.operateur);
  const tjPavIds=tj?new Set(tj.pavIds):new Set();

  const filtered=PAVS.filter(p=>
    !q||p.nom.toLowerCase().includes(q)||p.no.includes(q)||
    p.addr.toLowerCase().includes(q)||p.zone.toLowerCase().includes(q)
  );
  const done=S.rapports.map(r=>r.pavId);
  const nbDone=new Set(done).size;

  const pavCard=(p,highlight=false)=>{
    const lr=lastRapport(p.id);
    const dot=!lr?'dot-none':lr.statut==='ok'?'dot-ok':'dot-nok';
    const nonTermine=lr&&lr.complet===false;
    const border=highlight?'border:2px solid var(--blm);':'';
    const action=lr?'voir-rpt-pav':'go-pav';
    const dataId=lr?`data-rid="${lr.id}"`:`data-pid="${p.id}"`;
    return `<div class="pav" data-a="${action}" ${dataId} style="${border}">
      <div class="pav-badge" style="${highlight?'background:var(--bl);':''}">
        <span style="${highlight?'color:rgba(255,255,255,.7)':''}">PAV</span>
        <span style="${highlight?'color:#fff':''}">${esc(p.no)}</span>
      </div>
      <div class="pav-info">
        <div class="pav-name">${esc(p.nom)}</div>
        <div class="pav-addr">${esc(p.addr)}</div>
        <div class="pav-meta">
          ${p.rem?`<span class="badge b-bl">${esc(p.rem)}</span>`:''}
          ${lr&&!nonTermine?`<span class="badge b-ok">✓ ${new Date(lr.createdAt).toLocaleDateString('fr-FR')}</span>`:''}
          ${nonTermine?`<span class="badge b-or">⚠ Non terminé</span>`:''}
        </div>
      </div>
      <div class="pav-right">
        <a href="https://www.google.com/maps/dir/?api=1&destination=${p.gps}" target="_blank" rel="noopener" class="gps-link" onclick="event.stopPropagation()">🗺️</a>
        <div class="${dot}"></div>
      </div>
    </div>`;
  };

  /* Bloc tournée du jour */
  let tourneeHtml='';
  if(tj&&tjPavIds.size>0&&!q){
    const tjPavs=tj.pavIds.map(id=>PAVS.find(p=>p.id===id)).filter(Boolean);
    const tjDone=tjPavs.filter(p=>lastRapport(p.id)).length;
    tourneeHtml=`
    <div style="background:var(--bl);border-radius:var(--radius);padding:14px;margin-bottom:16px;color:#fff">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:13px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.05em">Ma tournée du jour</div>
          <div style="font-size:11px;opacity:.6;margin-top:2px">${tj.date.split('-').reverse().join('/')}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800">${tjDone}/${tjPavs.length}</div>
          <div style="font-size:11px;opacity:.7">effectués</div>
        </div>
      </div>
      <div style="background:rgba(255,255,255,.15);border-radius:6px;height:6px;margin-bottom:12px">
        <div style="background:#fff;height:6px;border-radius:6px;width:${Math.round(tjDone/tjPavs.length*100)}%"></div>
      </div>
      ${tjPavs.map(p=>pavCard(p,true)).join('')}
    </div>`;
  }

  /* Reste des PAV (hors tournée si pas de recherche) */
  const restFiltered=q?filtered:filtered.filter(p=>!tjPavIds.has(p.id));
  const zones={};
  restFiltered.forEach(p=>{
    if(!zones[p.zone])zones[p.zone]=[];
    zones[p.zone].push(p);
  });
  const zonesHtml=Object.entries(zones).sort(([a],[b])=>a.localeCompare(b)).map(([z,pavs])=>`
    <div class="zone-hdr">${esc(z.replace('ALM - ',''))} <span style="font-weight:400;color:var(--muted)">${pavs.length}</span></div>
    ${pavs.map(p=>pavCard(p,false)).join('')}
  `).join('');

  return `
  <div class="hdr">
    <div style="flex:1;min-width:0">
      <div class="hdr-title">🗑 Maintenance ALM</div>
      <div class="hdr-sub">${esc(S.operateur)}${S.isAdmin?' · Admin':''}${tj?' · Tournée assignée':''}</div>
    </div>
    ${S.isAdmin?`<button class="hdr-btn or" data-a="go-admin">Rapports</button>`:''}
    <button class="hdr-btn" data-a="logout" style="background:rgba(255,255,255,.1)">⏻</button>
  </div>
  <div class="pg">
    <div class="stats">
      <div class="stat"><div class="stat-n">${tj?tj.pavIds.length:PAVS.length}</div><div class="stat-l">${tj?'Ma tournée':'Points'}</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--gr)">${nbDone}</div><div class="stat-l">Visités</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--or)">${(tj?tj.pavIds.length:PAVS.length)-nbDone}</div><div class="stat-l">Restants</div></div>
    </div>
    <div class="search-wrap">
      <input type="search" id="search-in" placeholder="Rechercher PAV, adresse, zone…" value="${esc(S.search)}">
    </div>
    ${tourneeHtml}
    ${restFiltered.length===0&&!tourneeHtml?`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Aucun résultat</div></div>`:zonesHtml}
  </div>`;
}

/* ══════════════════════════════════════════════

function mkForm(pavId){
  const taches={};
  TACHES.forEach(t=>{taches[t.id]={fait:false,statut:'na'};});
  return {id:uid(),pavId,operateur:S.operateur,taches,tachesLibres:'',remarques:'',commentaire:'',photos:[],signature:null,nomSignataire:S.operateur,statut:'ok',createdAt:null};
}

  const pav=getPav(S.pavId);
  if(!pav)return vHome();
  const f=S.form;

  const photosHtml=(f.photos||[]).map((src,i)=>`
    <div class="ph-wrap">
      <img src="${src}" class="ph-img" data-a="zoom-ph" data-src="${src}" alt="photo ${i+1}">
      <button class="ph-del" data-a="del-ph" data-idx="${i}">×</button>
    </div>`).join('');

  const tachesHtml=TACHES.map(t=>{
    const tv=f.taches[t.id]||{fait:false,statut:'na'};
    return `<div class="task-row">
      <input type="checkbox" id="tk-${t.id}" data-a="tk-check" data-tid="${t.id}"${tv.fait?' checked':''}>
      <label for="tk-${t.id}">${esc(t.label)}</label>

        <option value="ok"${tv.statut==='ok'?' selected':''}>✓ Fait</option>
        <option value="ko"${tv.statut==='ko'?' selected':''}>✗ Non fait</option>
        <option value="na"${tv.statut==='na'?' selected':''}>— N/A</option>
      </select>
    </div>`;
  }).join('');

  return `
  <div class="hdr">
    <button class="hdr-back" data-a="back">←</button>
    <div style="flex:1;min-width:0">
      <div class="hdr-title">${esc(pav.nom)} — PAV ${esc(pav.no)}</div>
      <div class="hdr-sub">${esc(pav.addr)}</div>
    </div>
    <a href="https://www.google.com/maps/dir/?api=1&destination=${pav.gps}" target="_blank" rel="noopener" class="hdr-btn" style="font-size:18px;text-decoration:none">🗺️</a>
  </div>
  <div class="pg">
    <div class="card">
      <div class="card-title">Informations point</div>
      <div class="dr"><span class="dl">N° PAV Plan</span><span class="dv">${esc(pav.no)}</span></div>
      <div class="dr"><span class="dl">Nom borne</span><span class="dv">${esc(pav.nom)}</span></div>
      <div class="dr"><span class="dl">Adresse</span><span class="dv">${esc(pav.addr)}</span></div>
      <div class="dr"><span class="dl">Zone</span><span class="dv">${esc(pav.zone)}</span></div>
      <div class="dr"><span class="dl">GPS</span><span class="dv">${esc(pav.gps)}</span></div>
      ${pav.rem?`<div class="dr"><span class="dl">Remarque</span><span class="dv"><span class="badge b-bl">${esc(pav.rem)}</span></span></div>`:''}
    </div>

    <div class="card">
      <div class="card-title">📷 Photos <span style="color:var(--rd);font-size:11px;font-weight:400">(obligatoire)</span></div>
      <div class="ph-grid" id="ph-grid">
        ${photosHtml}
        <div class="ph-add" data-a="add-ph"><div class="ph-add-icon">📷</div><span>Ajouter</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Tâches à effectuer <span style="color:var(--rd);font-size:11px;font-weight:400">*</span></div>
      ${tachesHtml}
      <div class="field" style="margin-top:12px">
        <label>Tâches supplémentaires / libres</label>
        <textarea id="f-taches-libres" placeholder="Décrire toute autre opération effectuée…">${esc(f.tachesLibres)}</textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Remarques et consignes</div>
      <div class="field">
        <textarea id="f-remarques" placeholder="Remarques complémentaires, consignes…">${esc(f.remarques)}</textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Commentaire général</div>
      <div class="field">
        <textarea id="f-commentaire" placeholder="Commentaire général sur l'intervention…">${esc(f.commentaire)}</textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Statut global</div>
      <div style="display:flex;gap:10px">
        <label style="flex:1;display:flex;align-items:center;gap:8px;padding:12px;border:2px solid ${f.statut==='ok'?'var(--gr)':'var(--border)'};border-radius:10px;cursor:pointer;background:${f.statut==='ok'?'var(--grl)':'var(--card)'}">
          <input type="radio" name="statut" value="ok"${f.statut==='ok'?' checked':''} data-a="statut" style="accent-color:var(--gr)">
          <span style="font-weight:600;color:var(--gr)">✓ Conforme</span>
        </label>
        <label style="flex:1;display:flex;align-items:center;gap:8px;padding:12px;border:2px solid ${f.statut==='ko'?'var(--or)':'var(--border)'};border-radius:10px;cursor:pointer;background:${f.statut==='ko'?'var(--orl)':'var(--card)'}">
          <input type="radio" name="statut" value="ko"${f.statut==='ko'?' checked':''} data-a="statut" style="accent-color:var(--or)">
          <span style="font-weight:600;color:var(--or)">⚠ Non conforme</span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Signature intervenant <span style="color:var(--rd);font-size:11px;font-weight:400">(obligatoire)</span></div>

        <input type="text" id="f-signataire" value="${esc(f.nomSignataire)}" placeholder="Prénom Nom">
      </div>
      <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--muted)">Signer ici ↓</div>
      <div class="sig-wrap">
        <canvas id="sig-canvas" width="900" height="280"></canvas>
      </div>
      <div class="sig-actions">
        <button class="btn btn-sm" data-a="clear-sig">✕ Effacer</button>
        ${f.signature?`<span style="font-size:12px;color:var(--gr);align-self:center">✓ Signature enregistrée</span>`:''}
      </div>
      ${f.signature?`<div style="margin-top:10px"><img src="${f.signature}" style="width:100%;border-radius:8px;border:1px solid var(--border)"></div>`:''}
    </div>

    <button class="btn btn-p btn-f" data-a="save-form" style="font-size:16px;padding:14px">💾 Enregistrer l'intervention</button>
  </div>`;
}

/* ══════════════════════════════════════════════
   VUE : DETAIL RAPPORT
══════════════════════════════════════════════ */
function vDetail(){
  const r=getRapport(S.rid);
  if(!r)return go('home');
  const pav=getPav(r.pavId);

  const tachesHtml=TACHES.filter(t=>r.taches[t.id]&&r.taches[t.id].fait).map(t=>{
    const v=r.taches[t.id];
    const cls=v.statut==='ok'?'sta-ok':v.statut==='ko'?'sta-ko':'sta-na';
    const lbl=v.statut==='ok'?'Fait':v.statut==='ko'?'Non fait':'N/A';
    return `<div class="task-row" style="cursor:default">
      <span style="font-size:18px">${v.statut==='ok'?'✓':'✗'}</span>
      <span style="flex:1;font-size:14px">${esc(t.label)}</span>
      <span class="task-sta ${cls}">${lbl}</span>
    </div>`;
  }).join('');

  const photosHtml=(r.photos||[]).map((src,i)=>`
    <img src="${src}" class="ph-img" data-a="zoom-ph" data-src="${src}" alt="photo ${i+1}" style="cursor:zoom-in">`).join('');

  return `
  <div class="hdr">
    <button class="hdr-back" data-a="back">←</button>
    <div style="flex:1;min-width:0">
      <div class="hdr-title">Rapport — ${esc(pav?.nom||r.pavId)}</div>
      <div class="hdr-sub">${fdt(r.createdAt)}</div>
    </div>
    ${S.isAdmin?`<button class="hdr-btn or" data-a="export-rpt">📥 Export</button>`:''}
  </div>
  <div class="pg">
    <div class="card">
      <div class="card-title">Identification</div>
      <div class="dr"><span class="dl">N° PAV Plan</span><span class="dv">${esc(pav?.no||'')}</span></div>
      <div class="dr"><span class="dl">Nom borne</span><span class="dv">${esc(pav?.nom||'')}</span></div>
      <div class="dr"><span class="dl">Adresse</span><span class="dv">${esc(pav?.addr||'')}</span></div>
      <div class="dr"><span class="dl">GPS</span><span class="dv">${esc(pav?.gps||'')}</span></div>
      <div class="dr"><span class="dl">Opérateur</span><span class="dv">${esc(r.operateur)}</span></div>
      <div class="dr"><span class="dl">Date / heure</span><span class="dv">${fdt(r.createdAt)}</span></div>
      <div class="dr"><span class="dl">Statut</span><span class="dv"><span class="badge ${r.statut==='ok'?'b-ok':'b-or'}">${r.statut==='ok'?'✓ Conforme':'⚠ Non conforme'}</span></span></div>
      ${r.complet===false?`<div class="dr"><span class="dl">Avancement</span><span class="dv"><span class="badge b-or">⚠ Non terminé</span></span></div>`:''}
    </div>
    ${photosHtml?`<div class="card"><div class="card-title">📷 Photos</div><div class="ph-grid">${photosHtml}</div></div>`:''}
    ${tachesHtml?`<div class="card"><div class="card-title">Tâches effectuées</div>${tachesHtml}</div>`:''}
    ${r.tachesLibres?`<div class="card"><div class="card-title">Tâches libres</div><p style="font-size:14px;line-height:1.6">${esc(r.tachesLibres)}</p></div>`:''}
    ${r.remarques?`<div class="card"><div class="card-title">Remarques</div><p style="font-size:14px;line-height:1.6">${esc(r.remarques)}</p></div>`:''}
    ${r.commentaire?`<div class="card"><div class="card-title">Commentaire général</div><p style="font-size:14px;line-height:1.6">${esc(r.commentaire)}</p></div>`:''}
    <div class="card">
      <div class="card-title">Signature</div>
      <div class="dr"><span class="dl">Signataire</span><span class="dv">${esc(r.nomSignataire||r.operateur)}</span></div>
      ${r.signature?`<img src="${r.signature}" style="width:100%;border-radius:8px;border:1px solid var(--border);margin-top:10px">`:'<p style="color:var(--muted);font-size:13px;margin-top:8px">Aucune signature</p>'}

    </div>`:''}
    ${!S.isAdmin?`<div style="margin-top:8px"><button class="btn btn-p btn-f" data-a="continuer-insp" data-rid="${r.id}">✏️ Modifier l'intervention</button></div>`:''}
  </div>`;
}

/* ══════════════════════════════════════════════
   VUE : ADMIN — Liste rapports
══════════════════════════════════════════════ */
function vAdmin(){
  const tab=S.adminTab||'rapports';
  const tabs=`
  <div style="display:flex;gap:0;background:var(--bg);border-radius:var(--radius-sm);padding:3px;margin-bottom:14px;border:1px solid var(--border)">
    ${[['rapports','📋 Rapports'],['tournees','🗓 Tournées'],['users','👥 Utilisateurs']].map(([v,l])=>`
    <button data-a="admin-tab" data-tab="${v}" style="flex:1;padding:7px 4px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:${tab===v?'var(--bl)':'transparent'};color:${tab===v?'#fff':'var(--muted)'}">
      ${l}</button>`).join('')}
  </div>`;

  let content='';

  if(tab==='rapports'){
    const filtre=S.adminFiltre||'tous';
    const sorted=[...S.rapports].sort((a,b)=>b.createdAt-a.createdAt);
    const df=S.exportDateFrom,dt=S.exportDateTo;
    let filtred=filtre==='non-termine'?sorted.filter(r=>r.complet===false):
                filtre==='termine'?sorted.filter(r=>r.complet!==false):sorted;
    if(df)filtred=filtred.filter(r=>new Date(r.createdAt)>=new Date(df));
    if(dt)filtred=filtred.filter(r=>new Date(r.createdAt)<=new Date(dt+'T23:59:59'));

    const nbSel=S.exportSel.size;
    content=`
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Filtres & Export</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div class="field" style="margin:0"><label>Du</label><input type="date" id="exp-from" value="${df}" data-a="exp-date" data-which="from"></div>
        <div class="field" style="margin:0"><label>Au</label><input type="date" id="exp-to" value="${dt}" data-a="exp-date" data-which="to"></div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
        ${[['tous','Tous',sorted.length],['termine','✓ Terminés',sorted.filter(r=>r.complet!==false).length],['non-termine','⚠ Non terminés',sorted.filter(r=>r.complet===false).length]].map(([v,l,n])=>`
          <button data-a="admin-filtre" data-filtre="${v}" style="padding:5px 10px;border:1.5px solid ${filtre===v?'var(--bl)':'var(--border)'};border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:${filtre===v?'var(--bl)':'var(--card)'};color:${filtre===v?'#fff':'var(--muted)'}">
            ${l} <span style="opacity:.7">${n}</span></button>`).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" data-a="exp-sel-all" style="flex:1">☑ Tout sélectionner (${filtred.length})</button>
        <button class="btn btn-sm" data-a="exp-desel-all" style="flex:1">☐ Désélectionner</button>
      </div>
      ${nbSel>0?`<button class="btn btn-p btn-f" data-a="export-sel" style="margin-top:8px">📥 Exporter ${nbSel} rapport${nbSel>1?'s':''} sélectionné${nbSel>1?'s':''}</button>`:''}
    </div>
    ${filtred.length===0
      ?`<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Aucun rapport</div></div>`
      :filtred.map(r=>{
        const pav=getPav(r.pavId);
        const nonTermine=r.complet===false;
        const sel=S.exportSel.has(r.id);
        return `<div class="rpt-row" style="${nonTermine?'border-left:3px solid var(--or)':''}${sel?'background:var(--bll);':''}" >
          <div style="display:flex;align-items:center;gap:10px">
            <input type="checkbox" data-a="exp-chk" data-rid="${r.id}"${sel?' checked':''} style="width:18px;height:18px;accent-color:var(--blm);flex-shrink:0">
            <div style="flex:1;cursor:pointer" data-a="go-rpt" data-rid="${r.id}">
              <div class="rpt-head">
                <span class="rpt-pav">${esc(pav?.nom||r.pavId)} — PAV ${esc(pav?.no||'')}</span>
                <div style="display:flex;gap:4px">
                  ${nonTermine?`<span class="badge b-or">⚠</span>`:''}
                  <span class="badge ${r.statut==='ok'?'b-ok':'b-or'}">${r.statut==='ok'?'✓':'⚠'}</span>
                </div>
              </div>
              <div class="rpt-addr">${esc(pav?.addr||'')}</div>
              <div class="rpt-date" style="margin-top:4px">${fdt(r.createdAt)} · ${esc(r.operateur)}</div>
            </div>
          </div>
        </div>`;
      }).join('')}`;

  } else if(tab==='tournees'){
    const sorted=[...S.tournees].sort((a,b)=>b.date.localeCompare(a.date));
    const isToday=t=>t.date===todayStr();

/* ══════════════════════════════════════════════
   EXPORT MULTIPLE — un fichier .html par intervention, dans un .zip
══════════════════════════════════════════════ */
async function doExportMultiple(rapports){
  if(!rapports.length)return;
  if(typeof JSZip==='undefined'){toast('Erreur : bibliothèque ZIP indisponible','#C0392B');return;}
  toast('⏳ Préparation du ZIP…','#1B3A5C');
  const zip=new JSZip();
  const usedNames=new Set();
  rapports.forEach(r=>{
    const pav=getPav(r.pavId);
    const dateSlug=(r.createdAt?new Date(r.createdAt):new Date()).toISOString().slice(0,10);
    let base=`${pav?.nom||r.pavId}_${dateSlug}`.replace(/[^a-zA-Z0-9_-]/g,'_');
    let name=base+'.html',i=2;
    while(usedNames.has(name)){name=`${base}_${i}.html`;i++;}
    usedNames.add(name);
    zip.file(name,exportRapport(r));
  });
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`rapports_ALM_${rapports.length}_${Date.now()}.zip`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast(`📥 ${rapports.length} rapport${rapports.length>1?'s':''} exporté${rapports.length>1?'s':''} (.zip)`, '#2A7A4B');
}

/* ══════════════════════════════════════════════
   CANVAS SIGNATURE
══════════════════════════════════════════════ */
let sigDrawing=false,sigCtx=null,sigCanvas=null,sigHasContent=false;

function initSig(){
  sigCanvas=document.getElementById('sig-canvas');
  if(!sigCanvas)return;
  const rect=sigCanvas.getBoundingClientRect();
  sigCanvas.width=rect.width*window.devicePixelRatio;
  sigCanvas.height=rect.height*window.devicePixelRatio;
  sigCtx=sigCanvas.getContext('2d');
  sigCtx.scale(window.devicePixelRatio,window.devicePixelRatio);
  sigCtx.strokeStyle='#1B3A5C';
  sigCtx.lineWidth=2.5;
  sigCtx.lineCap='round';
  sigCtx.lineJoin='round';

  /* Restaurer une signature déjà tracée avant ce re-rendu (le canvas est
     recréé à chaque draw(), donc sans cela tout tracé serait perdu au
     moindre autre changement dans le formulaire — coche d'une tâche, etc.) */
  sigHasContent=false;
  if(S.form&&S.form.signature){
    const img=new Image();
    img.onload=()=>{
      sigCtx.drawImage(img,0,0,rect.width,rect.height);
      sigHasContent=true;
    };
    img.src=S.form.signature;
  }

  const pos=e=>{
    const r=sigCanvas.getBoundingClientRect();
    if(e.touches){return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};}
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  };

  sigCanvas.addEventListener('mousedown',e=>{sigDrawing=true;sigHasContent=true;sigCtx.beginPath();const p=pos(e);sigCtx.moveTo(p.x,p.y);});
  sigCanvas.addEventListener('mousemove',e=>{if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();});
  sigCanvas.addEventListener('mouseup',()=>{sigDrawing=false;snapSig();});
  sigCanvas.addEventListener('touchstart',e=>{e.preventDefault();sigDrawing=true;sigHasContent=true;sigCtx.beginPath();const p=pos(e);sigCtx.moveTo(p.x,p.y);},{passive:false});
  sigCanvas.addEventListener('touchmove',e=>{e.preventDefault();if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();},{passive:false});
  sigCanvas.addEventListener('touchend',()=>{sigDrawing=false;snapSig();});
}

/* Capture le canvas UNIQUEMENT si du contenu a réellement été tracé —
   sinon un canvas vierge (transparent) produirait quand même une dataURL
   "valide" et passerait à tort la validation obligatoire. */
function snapSig(){
  if(!sigCanvas||!S.form)return;
  if(sigHasContent){
    S.form.signature=sigCanvas.toDataURL('image/png');
  }
}

function clearSig(){
  if(!sigCanvas||!sigCtx)return;
  sigCtx.clearRect(0,0,sigCanvas.width/window.devicePixelRatio,sigCanvas.height/window.devicePixelRatio);
  sigHasContent=false;
  if(S.form)S.form.signature=null;
  draw();
}

/* ══════════════════════════════════════════════
   IMAGE COMPRESSION
══════════════════════════════════════════════ */
const compress=f=>new Promise(res=>{
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const M=700,cv=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',.62));
    };
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
});

/* ══════════════════════════════════════════════
   SNAP FORM
══════════════════════════════════════════════ */
function snapForm(){
  if(S.view!=='form'||!S.form)return;
  const g=id=>document.getElementById(id);
  if(g('f-taches-libres'))S.form.tachesLibres=g('f-taches-libres').value;
  if(g('f-remarques'))S.form.remarques=g('f-remarques').value;
  if(g('f-commentaire'))S.form.commentaire=g('f-commentaire').value;
  if(g('f-signataire'))S.form.nomSignataire=g('f-signataire').value;
}

/* ══════════════════════════════════════════════
   AFTER DRAW
══════════════════════════════════════════════ */
function afterDraw(){
  if(S.view==='home'){
    const s=document.getElementById('search-in');
    if(s){
      s.addEventListener('input',e=>{S.search=e.target.value;draw();});
      s.focus();
    }
  }
  if(S.view==='tournee-edit'){
    const s=document.getElementById('tsearch-in');
    if(s)s.addEventListener('input',e=>{S.tourneeSearch=e.target.value;draw();});
  }
  if(S.view==='form'){initSig();}

  document.getElementById('app').removeEventListener('click',onCk);
  document.getElementById('app').addEventListener('click',onCk);
  document.getElementById('app').removeEventListener('change',onCh);
  document.getElementById('app').addEventListener('change',onCh);
  document.getElementById('ph-in')?.removeEventListener('change',onPh);
  document.getElementById('ph-in')?.addEventListener('change',onPh);
}

async function onPh(e){
  const files=Array.from(e.target.files);
  if(!files.length||!S.form)return;
  snapForm();
  const compressed=await Promise.all(files.map(compress));
  S.form.photos=[...(S.form.photos||[]),...compressed];
  e.target.value='';
  draw();
}

/* ══════════════════════════════════════════════
   EVENT HANDLERS
══════════════════════════════════════════════ */
function onCh(e){
  const el=e.target;
  if(el.dataset.a==='tk-check'&&S.form){
    const tid=el.dataset.tid;
    if(!S.form.taches[tid])S.form.taches[tid]={fait:false,statut:'na'};
    S.form.taches[tid].fait=el.checked;
    S.form.taches[tid].statut=el.checked?'ok':'na';
    draw();
  }
  if(el.dataset.a==='tk-sta'&&S.form){
    const tid=el.dataset.tid;
    if(!S.form.taches[tid])S.form.taches[tid]={fait:false,statut:'na'};
    S.form.taches[tid].statut=el.value;
    if(el.value!=='na')S.form.taches[tid].fait=true;
    draw();
  }
  if(el.dataset.a==='statut'&&S.form){S.form.statut=el.value;draw();}
  if(el.dataset.a==='exp-date'){
    if(el.dataset.which==='from')S.exportDateFrom=el.value;
    else S.exportDateTo=el.value;
    draw();
  }
}

async function onCk(e){
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a;

  if(a==='logout'){S.operateur='';S.isAdmin=false;go('login');}
  else if(a==='go-admin'){S.adminTab='rapports';go('admin');}
  else if(a==='admin-tab'){S.adminTab=el.dataset.tab;draw();}
  else if(a==='admin-filtre'){S.adminFiltre=el.dataset.filtre;draw();}
  else if(a==='new-tournee'){
    S.tourneeForm={id:null,operateur:'',date:todayStr(),pavIds:[]};
    S.tourneeSearch='';
    go('tournee-edit');
  }
  else if(a==='edit-tournee'){
    const t=getTournee(el.dataset.tid);
    if(!t)return;
    S.tourneeForm={...t,pavIds:[...t.pavIds]};
    S.tourneeSearch='';
    go('tournee-edit');
  }
  else if(a==='del-tournee'){
    if(!confirm('Supprimer cette tournée ?'))return;
    S.tournees=S.tournees.filter(t=>t.id!==el.dataset.tid);
    await deleteTourneeFB(el.dataset.tid);
    draw();
  }
  else if(a==='back-tournee'){
    S.tourneeForm=null;S.tourneeSearch='';
    S.adminTab='tournees';
    go('admin');
  }
  else if(a==='sel-pav'&&S.tourneeForm){
    const pid=el.dataset.pid;
    /* Capturer les champs AVANT de redessiner pour éviter l'effacement */
    const op=document.getElementById('tf-operateur')?.value||S.tourneeForm.operateur;
    const dt=document.getElementById('tf-date')?.value||S.tourneeForm.date;
    S.tourneeForm.operateur=op;
    S.tourneeForm.date=dt;
    if(el.checked){if(!S.tourneeForm.pavIds.includes(pid))S.tourneeForm.pavIds.push(pid);}
    else{S.tourneeForm.pavIds=S.tourneeForm.pavIds.filter(id=>id!==pid);}
    draw();
  }
  else if(a==='sel-zone'&&S.tourneeForm){
    const op=document.getElementById('tf-operateur')?.value||S.tourneeForm.operateur;
    const dt=document.getElementById('tf-date')?.value||S.tourneeForm.date;
    S.tourneeForm.operateur=op;S.tourneeForm.date=dt;
    const zone=el.dataset.zone;
    const zonePavIds=PAVS.filter(p=>p.zone===zone).map(p=>p.id);
    zonePavIds.forEach(id=>{if(!S.tourneeForm.pavIds.includes(id))S.tourneeForm.pavIds.push(id);});
    draw();
  }
  else if(a==='sel-all-pav'&&S.tourneeForm){
    const op=document.getElementById('tf-operateur')?.value||S.tourneeForm.operateur;
    const dt=document.getElementById('tf-date')?.value||S.tourneeForm.date;
    S.tourneeForm.operateur=op;S.tourneeForm.date=dt;
    const q=(S.tourneeSearch||'').toLowerCase();
    const visible=q?PAVS.filter(p=>p.nom.toLowerCase().includes(q)||p.no.includes(q)||p.addr.toLowerCase().includes(q)||p.zone.toLowerCase().includes(q)):PAVS;
    visible.forEach(p=>{if(!S.tourneeForm.pavIds.includes(p.id))S.tourneeForm.pavIds.push(p.id);});
    draw();
  }
  else if(a==='desel-all-pav'&&S.tourneeForm){
    const op=document.getElementById('tf-operateur')?.value||S.tourneeForm.operateur;
    const dt=document.getElementById('tf-date')?.value||S.tourneeForm.date;
    S.tourneeForm.operateur=op;S.tourneeForm.date=dt;
    S.tourneeForm.pavIds=[];
    draw();
  }
  else if(a==='save-tournee'&&S.tourneeForm){
    const op=(document.getElementById('tf-operateur')?.value||'').trim();
    const dt=(document.getElementById('tf-date')?.value||'').trim();
    if(!op){toast('Saisissez le nom de l\'opérateur','#C0392B');return;}
    if(!dt){toast('Choisissez une date','#C0392B');return;}
    if(!S.tourneeForm.pavIds.length){toast('Sélectionnez au moins un PAV','#C0392B');return;}
    const tourneeFinale=S.tourneeForm.id
      ?{...S.tourneeForm,operateur:op,date:dt}
      :{...S.tourneeForm,id:uid(),operateur:op,date:dt};
    if(S.tourneeForm.id){
      S.tournees=S.tournees.map(t=>t.id===S.tourneeForm.id?tourneeFinale:t);
    } else {
      S.tournees=[...S.tournees,tourneeFinale];
    }
    await saveTournee(tourneeFinale);
    S.tourneeForm=null;S.tourneeSearch='';
    S.adminTab='tournees';
    toast('✅ Tournée enregistrée','#2A7A4B');
    go('admin');
  }
  else if(a==='back'){
    if(S.view==='form'){snapForm();go('home');}
    else if(S.view==='detail'){go(S.isAdmin&&S.fromAdmin?'admin':'home');}
    else if(S.view==='admin')go('home');
    else go('home');
  }
  else if(a==='back-suivi'){S.adminTab='tournees';go('admin');}
  else if(a==='go-pav'){
    const pid=el.dataset.pid;
    S.pavId=pid;
    S.form=mkForm(pid);
    go('form');
  }
  else if(a==='add-ph'){document.getElementById('ph-in').click();}
  else if(a==='del-ph'){
    snapForm();
    const idx=parseInt(el.dataset.idx);
    S.form.photos=S.form.photos.filter((_,i)=>i!==idx);
    draw();
  }
  else if(a==='zoom-ph'){
    const lb=document.getElementById('lightbox');
    const img=document.getElementById('lb-img');
    if(lb&&img){img.src=el.dataset.src;lb.classList.add('open');}
  }
  else if(a==='clear-sig'){clearSig();}
  else if(a==='save-form'){
    snapForm();
    snapSig();
    const f=S.form;
    if(!f.photos||!f.photos.length){toast('📷 Ajoutez au moins une photo avant d\'enregistrer','#C0392B');return;}
    if(!(f.nomSignataire||'').trim()){toast('✍️ Saisissez le nom du signataire','#C0392B');return;}
    if(!f.signature){showModaleSignature();return;}
    const tachesNonCoches=TACHES.filter(t=>!f.taches[t.id]||!f.taches[t.id].fait);
    const toutesCoches=tachesNonCoches.length===0;
    const doSave=async()=>{
      f.complet=toutesCoches;
      f.createdAt=f.createdAt||Date.now();
      f.updatedAt=Date.now();
      const editId=f._editId;
      delete f._editId;
      toast('⏳ Enregistrement…','#1B3A5C');
      try{
        await saveRapport(f);
        if(editId){
          S.rapports=S.rapports.map(r=>r.id===editId?f:r);
        } else {
          S.rapports=[...S.rapports,f];
        }
        toast(toutesCoches?'✅ Intervention enregistrée':'⚠️ Intervention enregistrée — non terminée',toutesCoches?'#2A7A4B':'#E07B2A');
        go('home');
      }catch(err){
        toast('❌ Erreur d\'enregistrement — réessayez','#C0392B');
      }
    };
    if(!toutesCoches){showModaleTaches(tachesNonCoches,doSave);}
    else{doSave();}
  }
  else if(a==='continuer-insp'){
    const r=getRapport(el.dataset.rid);
    if(!r)return;
    S.pavId=r.pavId;
    S.form=JSON.parse(JSON.stringify(r)); /* deep copy */
    S.form._editId=r.id; /* marquer comme édition */
    go('form');
  }
  else if(a==='voir-rpt-pav'){
    S.rid=el.dataset.rid;
    S.fromAdmin=false;
    go('detail');
  }
  else if(a==='voir-rpt'){
    S.rid=el.dataset.rid;
    S.fromAdmin=false;
    go('detail');
  }
  else if(a==='go-rpt'){
    S.rid=el.dataset.rid;
    S.fromAdmin=S.view==='admin';
    go('detail');
  }
  else if(a==='export-rpt'){doExportRapport(S.rid);}
  else if(a==='export-all'){doExportAll();}
  else if(a==='add-user'){
    const nom=(document.getElementById('new-user-nom')?.value||'').trim();
    const pwd=(document.getElementById('new-user-pwd')?.value||'').trim();
    const role=document.getElementById('new-user-role')?.value||'controleur';
    if(!nom){toast('Saisissez un nom','#C0392B');return;}
    if(!pwd){toast('Saisissez un mot de passe','#C0392B');return;}
    if(S.users.some(u=>u.nom.toLowerCase()===nom.toLowerCase())){toast('Cet utilisateur existe déjà','#C0392B');return;}
    const newUser={id:uid(),nom,pwd,admin:role==='admin'};
    S.users=[...S.users,newUser];
    await saveUser(newUser);
    draw();
  }
  else if(a==='del-user'){
    if(!confirm('Supprimer cet utilisateur ?'))return;
    S.users=S.users.filter(u=>u.id!==el.dataset.uid);
    await deleteUserFB(el.dataset.uid);
    draw();
  }
  else if(a==='edit-user-pwd'){
    const u=S.users.find(u=>u.id===el.dataset.uid);
    if(!u)return;
    const newPwd=prompt(`Nouveau mot de passe pour ${u.nom} :`);
    if(newPwd===null)return;
    if(!newPwd.trim()){toast('Mot de passe vide, non modifié','#C0392B');return;}
    const updated={...u,pwd:newPwd.trim()};
    S.users=S.users.map(x=>x.id===u.id?updated:x);
    await saveUser(updated);
    toast('✅ Mot de passe modifié','#2A7A4B');
    draw();
  }
  else if(a==='exp-chk'){
    if(el.checked)S.exportSel.add(el.dataset.rid);
    else S.exportSel.delete(el.dataset.rid);
    draw();
  }
  else if(a==='exp-sel-all'){
    const filtre=S.adminFiltre||'tous';
    const df=S.exportDateFrom,dt2=S.exportDateTo;
    let filtred=[...S.rapports].sort((a,b)=>b.createdAt-a.createdAt);
    if(filtre==='non-termine')filtred=filtred.filter(r=>r.complet===false);
    if(filtre==='termine')filtred=filtred.filter(r=>r.complet!==false);
    if(df)filtred=filtred.filter(r=>new Date(r.createdAt)>=new Date(df));
    if(dt2)filtred=filtred.filter(r=>new Date(r.createdAt)<=new Date(dt2+'T23:59:59'));
    filtred.forEach(r=>S.exportSel.add(r.id));
    draw();
  }
  else if(a==='exp-desel-all'){S.exportSel.clear();draw();}
  else if(a==='export-sel'){
    const ids=[...S.exportSel];
    if(!ids.length){toast('Aucun rapport sélectionné','#C0392B');return;}
    const rpts=ids.map(id=>S.rapports.find(r=>r.id===id)).filter(Boolean);
    doExportMultiple(rpts);
  }
  else if(a==='suivi-tournee'){S.tid=el.dataset.tid;go('suivi-tournee');}
  else if(a==='modifier-rapport'){
    const r=getRapport(S.rid);
    if(!r)return;
    S.pavId=r.pavId;
    S.form=JSON.parse(JSON.stringify(r));
    S.form._editId=r.id;
    go('form');
  }
  else if(a==='ask-del-rpt'){
    const z=document.getElementById('del-z');
    if(z)z.innerHTML=`<div class="alert-card"><div class="alert-title">⚠ Supprimer ce rapport ?</div>
      <div class="btn-row"><button class="btn btn-d" data-a="do-del-rpt">🗑 Supprimer</button>
      <button class="btn" data-a="cancel-del">Annuler</button></div></div>`;
  }
  else if(a==='do-del-rpt'){
    const delId=S.rid;
    S.rapports=S.rapports.filter(r=>r.id!==delId);
    await deleteRapportFB(delId);
    toast('Rapport supprimé');
    go('admin');
  }
  else if(a==='cancel-del'){draw();}
}

/* ══════════════════════════════════════════════
   LIGHTBOX
══════════════════════════════════════════════ */
function closeLb(){document.getElementById('lightbox')?.classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
function toast(msg,color='#1B3A5C'){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  t.style.background=color;
  t.style.color='#fff';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},2200);
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
async function init(){
  document.getElementById('app').innerHTML=`
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:rgba(255,255,255,.8);background:var(--bl)">
      <div style="font-size:2.2rem">🗑</div>
      <div style="font-size:14px">Chargement des données…</div>
    </div>`;
  try{
    await Promise.all([loadRapports(),loadTournees(),loadUsers()]);
  }catch(e){
    document.getElementById('app').innerHTML=`
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--bl);color:#fff">
        <div style="font-size:2rem">⚠️</div>
        <div style="font-weight:600">Connexion impossible à la base de données</div>
        <div style="font-size:13px;opacity:.7">${esc(e.message||'')}</div>
        <button class="btn btn-or" style="margin-top:12px" onclick="init()">Réessayer</button>
      </div>`;
    return;
  }
  draw();
}
init();
